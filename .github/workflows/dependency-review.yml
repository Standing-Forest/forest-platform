# Blocks a pull request that would introduce a dependency with a known
# vulnerability, or one whose licence is incompatible with this project.
# Catches the problem before it is merged rather than after.
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail on anything moderate or worse. Low-severity advisories in
          # transitive development dependencies are noisy and would train
          # everyone to ignore this check.
          fail-on-severity: moderate
          # Copyleft licences are not compatible with redistributing this
          # project under Apache-2.0.
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0
          comment-summary-in-pr: on-failure
